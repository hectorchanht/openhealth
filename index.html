<style>
:root{--bg:#0a0a0b;--panel:#131315;--panel2:#17171a;--line:#26262b;--text:#f5f2ee;--muted:#a8a29b;--accent:#3fb68b;--accent-soft:#7ad9b6;--radius:16px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans CJK TC",sans-serif;--serif:Georgia,"Times New Roman","Noto Serif TC","Noto Serif CJK TC",serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 20px;min-width:0}
a{color:var(--accent-soft)}
header.utility{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700;letter-spacing:.02em;min-width:0}
.brand img{width:40px;height:40px;flex:0 0 auto}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .hall{color:var(--muted);font-weight:500;font-size:.85rem}
.lang-switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel);flex:0 0 auto}
.lang-switch button{min-width:44px;min-height:34px;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font:600 .88rem var(--sans)}
.lang-switch button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.hero{padding:38px 0 8px}
.hero .mark{width:84px;height:84px}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.05;margin:.35em 0 .25em;font-weight:800;letter-spacing:-.01em;overflow-wrap:break-word}
.hero .promise{font-family:var(--serif);font-size:clamp(1.12rem,4.6vw,1.45rem);line-height:1.5;color:#e8e2d9;max-width:34em}
.status{display:inline-flex;max-width:100%;margin-top:16px;padding:7px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent-soft);font-size:.9rem;font-weight:600}
.status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
section.block{padding:22px 0 4px}
section.block>h2{font-size:clamp(1.4rem,6vw,1.9rem);margin:10px 0 10px}
section.block>p{color:#e8e2d9;max-width:36em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 14px;min-width:0}
.card h3{font-size:1.12rem;margin:0 0 .4em;line-height:1.3;overflow-wrap:break-word}
.card p{margin:0;color:var(--muted)}
ol.road{margin:0;padding-left:1.3em;color:#e8e2d9}
ol.road li{margin:0 0 10px}
.kicker{color:var(--accent-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:26px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem;margin-top:26px}
footer p{margin:0}footer .links{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.footer-legal{color:var(--muted);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
@media (max-width:520px){header.utility{min-height:56px}footer{align-items:flex-start;flex-direction:column}}

<script>
const I={"en": {"promise": "Birth, aging, sickness and death — in the plainest language.", "desc": "OpenHealth opens the whole of health — birth, aging, sickness and death — in the plainest language, for ages 3 to 90, organised by the four stages every life passes through. Education, never diagnosis.", "whatH": "What it is", "goalH": "END GOAL", "goal": "Open medical knowledge that sits behind jargon, fear and appointment slots: the whole of health, in the plainest language, for ages 3 to 90, organised by the four stages every life passes through — 生老病死， the one market that includes literally everyone, because nobody opts out of being born, aging, getting sick, and dying.", "roadH": "ROADMAP", "statusH": "STATUS", "status": "Founding — direction set, grilling not yet done. No content cards are published yet; the seed content pack is the next step.", "guardH": "Guardrails", "guard": "Education, NEVER diagnosis or treatment instruction for an individual: cards explain conditions and systems; personal decisions route to clinicians, and red-flag content errs toward “seek care now”. Every medical claim is sourced and dated — medical knowledge changes, so review cadence is part of the product, and stale cards are defects. Tone: calm, plain, human — health content is read by frightened people at 3am.", "foot": "Dawn Studio · Independent software.", "hall": "OpenSchool family", "what": [["生 — Birth", "Birth, children, development: what normal looks like, what to watch, when to see a doctor."], ["老 — Aging", "Parents' and your own aging — mobility, memory, medicines, care options; written for the adult child as much as the elder."], ["病 — Illness", "Plain-language explainers of common conditions and symptoms — what it is, what doctors do about it, red flags that mean “go now”, how to prepare for the appointment and what to ask."], ["死 — End of life", "Hospice and palliative care in plain words, advance directives, wills — cross-linked to OpenLaw — with grief and family logistics handled gently and factually. Plus a standing layer: how to deal with the medical system itself — referrals, waitlists, second opinions and records (Hong Kong + Canada first)."]], "road": ["Seed content pack — the four halls （生老病死） × starter cards", "Space — the founding home for the work", "Grilling — audience order, clinician review route, Hong Kong vs Canada systems first"]}, "zh": {"promise": "生老病死，用最直白嘅語言講明。", "desc": "OpenHealth 打開成個醫療世界 — 生、老、病、死 — 用最直白嘅語言，3 到 90 歲，按每個人生必經嘅四個階段去組織。係教育，永遠唔係診斷。", "whatH": "呢個係咩", "goalH": "終極目標 · END GOAL", "goal": "打開被術語、恐懼同預約時段擋住嘅醫療知識：成個健康世界，用最直白嘅語言，3 到 90 歲，按每個人生必經嘅四個階段去組織 — 生老病死，係唯一包括每一個人嘅市場，因為冇人可以唔出生、唔老、唔病、唔死。", "roadH": "路線圖 · ROADMAP", "statusH": "現況 · STATUS", "status": "創建中 — 方向已定，grilling 未完成。暫時未有內容卡出版；下一步係種子內容包。", "guardH": "守則", "guard": "係教育，永遠唔係為個人作診斷或治療指示：卡片解說病症同制度；個人決定交返俾臨床醫生，紅旗內容寧可叫你「即刻求醫」。每項醫療講法都有來源同日期 — 醫學知識會變，覆核節奏係產品嘅一部分，過期卡係缺陷。語氣：平靜、直白、有人味 — 健康內容係俾半夜三點驚緊嘅人睇嘅。", "foot": "Dawn Studio · 獨立軟件。", "hall": "OpenSchool 家族", "what": [["生", "出生、兒童、成長：咩係正常、要留意咩、幾時要睇醫生。"], ["老", "父母同自己嘅老去 — 行動、記憶、藥物、照顧選擇；為成年子女而寫，亦為長者而寫。"], ["病", "常見病症同症狀嘅直白解說 — 係咩嚟、醫生會點處理、邊啲係「即刻去」嘅紅旗、點準備覆診同問咩。"], ["死", "紓緩同臨終照顧嘅直白講法、預設醫療指示、遺囑 — 互連 OpenLaw — 哀傷同家庭安排，溫和而如實咁處理。另有常設一層：點樣同醫療系統打交道 — 轉介、輪候、第二意見、病歷（香港 + 加拿大先行）。"]], "road": ["種子內容包 — 生老病死四個大堂 × 入門卡", "Space — 呢個項目嘅立派基地", "Grilling — 受眾次序、臨床覆核路線、香港 vs 加拿大醫療系統邊個先"]}};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setLang(l){
  document.documentElement.lang = l==="zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(typeof I[l][k]==="string") el.textContent=I[l][k]; });
  document.getElementById("what").innerHTML = I[l].what.map(x=>'<div class="card"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join("");
  document.getElementById("road").innerHTML = I[l].road.map(x=>'<li>'+esc(x)+'</li>').join("");
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  document.getElementById("btn-zh").setAttribute("aria-pressed", l==="zh");
  try{localStorage.setItem("openhealth-lang", l)}catch(e){}
}
document.getElementById("btn-en").addEventListener("click",()=>setLang("en"));
document.getElementById("btn-zh").addEventListener("click",()=>setLang("zh"));
let init="en"; try{ init = localStorage.getItem("openhealth-lang")||"en" }catch(e){}
setLang(init==="zh"?"zh":"en");
</script>
